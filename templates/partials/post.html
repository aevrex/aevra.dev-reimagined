<article class="mx-auto max-w-3xl px-5 py-14 sm:px-8 sm:py-20">
	<a href="/blog" class="text-sm font-bold text-stone-500 hover:text-stone-900">&larr; All posts</a>

	<header class="mt-10 border-b border-stone-200 pb-10">
		<p class="text-sm font-bold uppercase tracking-[0.18em] text-amber-700">{{.Post.Category}} / {{.Post.Date}}</p>
		<h1 class="mt-4 text-4xl font-bold leading-tight tracking-tight sm:text-6xl">{{.Post.Title}}</h1>
		<p class="mt-6 text-xl leading-8 text-stone-600">{{.Post.Excerpt}}</p>
	</header>

	<div class="space-y-6 py-10 text-lg leading-8 text-stone-700">
		{{range .Post.Body}}<p>{{.}}</p>{{end}}
	</div>

	<footer class="border-t border-stone-200 pt-8">
		<a href="/blog" class="font-bold">&larr; Back to the journal</a>
	</footer>
</article>

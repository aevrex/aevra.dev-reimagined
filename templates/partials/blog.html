<section class="mx-auto max-w-5xl px-5 py-14 sm:px-8 sm:py-20">
	<button hx-get="/home" hx-target="#content" class="text-sm font-bold text-stone-500 hover:text-stone-900">&larr; Home</button>

	<div class="mt-9 max-w-2xl">
		<p class="text-sm font-bold uppercase tracking-[0.18em] text-amber-700">Journal</p>
		<h1 class="mt-3 text-4xl font-bold tracking-tight sm:text-6xl">Useful notes, plainly written.</h1>
		<p class="mt-5 text-lg leading-8 text-stone-600">Thoughts on websites, hosting, automation, and keeping digital work understandable.</p>
	</div>

	<div class="mt-12 divide-y divide-stone-200 border-y border-stone-200">
		{{range .}}
		<article class="grid gap-4 py-8 md:grid-cols-[11rem_1fr_auto] md:items-start">
			<p class="text-sm font-medium text-stone-500">{{.Category}} / {{.Date}}</p>
			<div>
				<h2 class="text-2xl font-bold tracking-tight">{{.Title}}</h2>
				<p class="mt-3 max-w-2xl leading-7 text-stone-600">{{.Excerpt}}</p>
			</div>
			<button hx-get="/blog/{{.Slug}}" hx-target="#content" class="text-left text-sm font-bold md:text-right">
				Read post &rarr;
			</button>
		</article>
		{{end}}
	</div>
</section>

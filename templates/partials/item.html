<section class="mx-auto max-w-5xl px-5 py-14 sm:px-8 sm:py-20">
	<a href="/store" class="text-sm font-bold text-stone-500 hover:text-stone-900">&larr; Store</a>

	<div class="mt-10 grid gap-10 lg:grid-cols-[1fr_22rem] lg:items-start">
		<div>
			<p class="text-sm font-bold uppercase tracking-[0.18em] text-amber-700">{{.Item.Price}}</p>
			<h1 class="mt-4 text-4xl font-bold tracking-tight sm:text-6xl">{{.Item.Name}}</h1>
			<p class="mt-6 max-w-2xl text-xl leading-8 text-stone-600">{{.Item.Description}}</p>
			<p class="mt-8 max-w-2xl leading-7 text-stone-600">
				This is a clear starting point, not a maze of upgrades. The final scope is agreed before work begins, and you keep ownership of the result.
			</p>
		</div>

		<aside class="rounded-3xl bg-stone-900 p-7 text-white">
			<h2 class="text-xl font-bold">What is included</h2>
			<ul class="mt-6 space-y-4 text-sm text-stone-300">
				{{range .Item.Includes}}<li class="flex gap-3"><span class="font-bold text-amber-400">+</span> {{.}}</li>{{end}}
			</ul>
			<a href="/contact" class="mt-8 block rounded-xl bg-white px-5 py-3 font-bold text-stone-900 hover:bg-stone-100 text-center border border-stone-200">
				Contact me
			</a>
		</aside>
	</div>
</section>

<section class="mx-auto max-w-6xl px-5 py-14 sm:px-8 sm:py-20">
	<button hx-get="/home" hx-target="#content" class="text-sm font-bold text-stone-500 hover:text-stone-900">&larr; Home</button>

	<div class="mt-9 max-w-3xl">
		<p class="text-sm font-bold uppercase tracking-[0.18em] text-amber-700">Store</p>
		<h1 class="mt-3 text-4xl font-bold tracking-tight sm:text-6xl">A small menu. Clear outcomes.</h1>
		<p class="mt-5 text-lg leading-8 text-stone-600">Start with the thing closest to what you need. The scope stays understandable and the work stays yours.</p>
	</div>

	<div class="mt-12 grid gap-6 lg:grid-cols-3">
		{{range .}}
		<article class="flex flex-col rounded-3xl border border-stone-200 bg-white p-7 shadow-sm">
			<p class="text-sm font-bold text-amber-700">{{.Price}}</p>
			<h2 class="mt-5 text-2xl font-bold">{{.Name}}</h2>
			<p class="mt-4 leading-7 text-stone-600">{{.Description}}</p>
			<ul class="mt-7 flex-1 space-y-3 border-t border-stone-200 pt-6 text-sm text-stone-700">
				{{range .Includes}}<li class="flex gap-3"><span class="text-amber-700">+</span> {{.}}</li>{{end}}
			</ul>
			<button hx-get="/store/{{.Slug}}" hx-target="#content" class="mt-8 rounded-xl bg-stone-900 px-5 py-3 font-bold text-white hover:bg-amber-700">
				View package
			</button>
		</article>
		{{end}}
	</div>
</section>
